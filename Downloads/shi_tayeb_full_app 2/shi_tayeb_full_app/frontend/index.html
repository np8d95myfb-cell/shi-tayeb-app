<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shi Tayeb App</title>

<style>
:root{
  --bg:#f8f3ee;
  --card:#ffffff;
  --text:#1c2430;
  --muted:#777;
  --main:#d98b5f;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:linear-gradient(180deg,#fff,#f8f3ee);
  color:var(--text);
}

/* NAVBAR */
.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:10px;
}

.btn{
  padding:8px 14px;
  border-radius:10px;
  border:none;
  background:#eee;
  cursor:pointer;
}

.btn.main{
  background:var(--main);
  color:white;
}

/* HERO */
.hero{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:40px;
  gap:30px;
}

.hero-text{
  max-width:500px;
}

.hero-text h1{
  font-size:32px;
  margin-bottom:10px;
}

.hero-text p{
  color:var(--muted);
  margin-bottom:20px;
}

.hero-buttons{
  display:flex;
  gap:10px;
}

.hero img{
  width:350px;
  border-radius:20px;
}

/* CARDS */
.section{
  padding:40px;
}

.cards{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.card{
  background:var(--card);
  padding:15px;
  border-radius:15px;
  width:300px;
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

.card img{
  width:100%;
  border-radius:10px;
}

.card h3{
  margin:10px 0;
}

.card p{
  font-size:14px;
  color:var(--muted);
}

.card button{
  margin-top:10px;
  padding:8px;
  border:none;
  border-radius:8px;
  background:var(--main);
  color:white;
  cursor:pointer;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:20px;
  color:var(--muted);
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="logo">🍽️ Shi Tayeb</div>
  <div class="buttons">
    <button class="btn main">اشترك الآن</button>
    <button class="btn">من نحن</button>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-text">
    <h1>حوّلي وصفتك لفيديو خلال ثواني ✨</h1>
    <p>اكتبي وصفتك ونحن نحولها لفيديو احترافي جاهز للنشر</p>

    <div class="hero
